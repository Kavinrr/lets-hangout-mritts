<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VINYL SMALL -->
    <div class="vinyl-small visible" id="vinylSmall">
        <div class="vinyl vinyl-sm" id="vinylSm">
            <div class="vinyl-cover"><img src="images/vinyl2.jpg" alt="Cover"></div>
            <div class="vinyl-hole"></div>
        </div>
        <button class="music-toggle music-toggle-sm" id="musicToggleSm" aria-label="Toggle music">
            <span class="music-icon-sm">♪</span>
        </button>
    </div>

    <!-- AUDIO -->
    <audio id="bgMusic" loop>
        <source src="music/TV_Girl_-_Birds_Don_t_Sing_(mp3.pm).mp3" type="audio/mpeg">
    </audio>

    <!-- DECLINE PAGE -->
    <section id="decline" class="page active">
        <div class="container center-content">
            <h2 class="decline-title">Wait...</h2>
            <p class="decline-subtitle">Are you absolutely sure 🥹👉🏽👈🏽 ?</p>
            <div class="baby-photo-placeholder">
                <div class="photo-frame">
                    <img src="images/personal/IMG_20260806_191022_727.jpg" alt="Little Kavin">
                </div>
            </div>
            <p class="decline-text">This is who you are saying "no" to, btw. 🥺 He'd be mildly disappointed.</p>
            <a href="javascript:history.back()" class="btn-primary" style="margin-top: 1.5rem;">Maybe I clicked the wrong button</a>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>Built with copious amounts of protein shakes 🥤, za 🌿 and an unreasonable amount of excitement ✨</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
